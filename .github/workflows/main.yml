name: main

on:
  pull_request:
  push:
    branches: [main]

jobs:
  main:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["py311", "py312", "py313", "py314", "py315", "pypy3"]'
  main-win:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["py311"]'
      os: windows-latest
